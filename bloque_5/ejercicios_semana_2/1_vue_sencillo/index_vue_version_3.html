<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Contador con Vue 3</title>
</head>
<body>
    <h1>Ejemplo Vue 3</h1>

    <div id="app">
        <p>{{ counter }}</p>
        <button @click="increment">Incrementar</button>
        <button @click="decrement">Decrementar</button>
    </div>

    <!-- Vue 3 desde CDN -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script>
        // En Vue 3 la aplicación se crea con createApp(...).mount(...)
        const { createApp } = Vue;

        createApp({
            // En Vue 3 data() es SIEMPRE una función que devuelve un objeto
            data() {
                return {
                    counter: 0
                };
            },
            methods: {
                increment() {
                    this.counter++;
                },
                decrement() {
                    this.counter--;
                }
            }
        }).mount('#app');
    </script>
</body>
</html>
