<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contador de Visitas - Vue 3</title>
  <!-- CDN de Vue 3 -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>

  <div id="app">
    <h2>Contador de Visitas</h2>
    <p>Has visitado esta página {{ visits }} veces en este navegador.</p>
  </div>

  <script>
    // Desestructuramos createApp de Vue 3
    const { createApp } = Vue;

    // Creamos la aplicación Vue 3
    createApp({
      // Función data que devuelve el estado reactivo
      data() {
        return {
          visits: 0  // Número de visitas inicializado en 0
        }
      },
      // Hook del ciclo de vida created se ejecuta cuando la instancia es creada
      created() {
        // localStorage conserva el valor aunque se cierre el navegador (sessionStorage solo durante la sesión)
        // Si no hay valor guardado, getItem devuelve null y partimos de 0
        const previous = parseInt(localStorage.getItem('visits')) || 0;
        this.visits = previous + 1;
        // Guardamos el nuevo valor en localStorage
        localStorage.setItem('visits', this.visits);
      }
    }).mount('#app');  // Montamos la aplicación en el elemento con id="app"
  </script>

</body>
</html>
