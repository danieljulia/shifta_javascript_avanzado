<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Sobre mí - My Portfolio</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="js/app.js"></script> <!-- Componentes compartidos: deben cargarse antes de crear la app -->
</head>
<body>
  <div id="app">
    <site-header></site-header>

    <main>
      <h1>Sobre mí</h1>
      <about-section></about-section>
    </main>

    <site-footer></site-footer>
  </div>

  <!-- Plantilla del componente, dentro del propio HTML -->
  <template id="about-template">
    <section>
      <p><strong>{{ name }}</strong></p>
      <p>{{ bio }}</p>
      <p>Me encanta aprender, enseñar y crear webs limpias y elegantes.</p>
    </section>
  </template>

  <script>
    const { createApp } = Vue;

    // El componente tiene sus propios datos con data()
    const AboutSection = {
      template: '#about-template',
      data() {
        return {
          name: "Alba Nora",
          bio: "Desarrolladora web apasionada por JavaScript, Vue.js y los proyectos creativos."
        };
      }
    };

    // SiteHeader y SiteFooter vienen de js/app.js
    createApp({
      components: { AboutSection, SiteHeader, SiteFooter }
    }).mount('#app');
  </script>
</body>
</html>
