<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Inicio - My Portfolio</title>

  <!-- Componentes compartidos (SiteHeader, SiteFooter) -->
  <script src="js/app.js"></script>
</head>
<body>
  <div id="app">
    <site-header></site-header>

    <main>
      <h1>¡Bienvenido!</h1>
      <home-section></home-section>
    </main>

    <site-footer></site-footer>
  </div>

  <!-- Plantilla del componente, dentro del propio HTML -->
  <template id="home-template">
    <section>
      <p>Hola 👋 Soy Alba Nora, desarrolladora web creativa en Barcelona.</p>
      <p>¡Explora mis proyectos y conoce más sobre mí!</p>
    </section>
  </template>

  <script>
    const { createApp } = Vue;

    // Componente local de esta página
    const HomeSection = {
      template: '#home-template'
    };

    // SiteHeader y SiteFooter vienen de js/app.js; los registramos para usarlos en la plantilla
    createApp({
      components: { HomeSection, SiteHeader, SiteFooter }
    }).mount('#app');
  </script>
</body>
</html>
