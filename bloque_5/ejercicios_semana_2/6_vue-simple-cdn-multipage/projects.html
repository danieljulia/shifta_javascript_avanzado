<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Proyectos - My Portfolio</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="js/app.js"></script> <!-- Componentes compartidos y carga del JSON -->
</head>
<body>
  <div id="app">
    <site-header></site-header>

    <main>
      <h1>Proyectos</h1>
      <project-list></project-list>
    </main>

    <site-footer></site-footer>
  </div>

  <!-- Plantilla del componente, dentro del propio HTML -->
  <template id="projects-template">
    <section>
      <ul>
        <!-- v-for recorre la lista de proyectos cargada desde data/data.json -->
        <li v-for="p in projects" :key="p.name">
          <strong>{{ p.name }}</strong> — {{ p.tech }}
          <br>{{ p.description }}
          <a :href="p.url" target="_blank">Ver</a>
        </li>
      </ul>
      <p v-if="projects.length === 0">No hay proyectos que mostrar</p>
    </section>
  </template>

  <script>
    const { createApp } = Vue;

    // La lista empieza vacía y se rellena cuando el JSON ya está cargado
    const ProjectList = {
      template: '#projects-template',
      data() {
        return {
          projects: []
        };
      },
      async mounted() {
        this.projects = await projects; // esperamos a la promesa definida en js/app.js
      }
    };

    createApp({
      components: { ProjectList, SiteHeader, SiteFooter }
    }).mount('#app');
  </script>
</body>
</html>
