<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vue SPA - PWA Example</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css">
<link rel="stylesheet" href="styles.css">
  <!-- PWA manifest link - point to external manifest.json -->
  <link rel="manifest" href="manifest.json">
  
  <!-- PWA related meta tags -->
  <meta name="theme-color" content="#42b983">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Vue PWA">
  
  
</head>
<body>
  <div id="app">

    <!-- router-link: enlace de navegación interna gestionado por Vue Router
         (cambia la vista sin recargar la página). -->
    <div class="nav">
      <router-link to="/">Home</router-link>
      <router-link to="/about">About</router-link>
      <router-link to="/contact">Contact</router-link>
    </div>

    <!-- router-view: punto donde se renderiza el componente de la ruta activa.
         En Vue Router 4, para aplicar una transición usamos v-slot="{ Component }"
         y <component :is="Component"> dentro de <transition>. -->
    <router-view v-slot="{ Component }">
      <transition name="fade" mode="out-in">
        <component :is="Component" />
      </transition>
    </router-view>
  </div>

  <!-- Vue 3 y Vue Router 4 desde CDN (build "global": exponen Vue y VueRouter) -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="https://unpkg.com/vue-router@4/dist/vue-router.global.js"></script>

  <script>
    // Componentes de cada ruta (objetos con un template).
    const Home = {
      template: `
        <div class="page">
          <h1>Home Page</h1>
          <p>Welcome to our Vue SPA with PWA capabilities!</p>
          <p>This is a simple example of a Single Page Application built with Vue.js and Vue Router.</p>
          <p>You can add this to your home screen as a PWA!</p>
        </div>
      `
    };

    const About = {
      template: `
        <div class="page">
          <h1>About Page</h1>
          <p>This is a demonstration of:</p>
          <ul>
            <li>Vue.js for reactive UI</li>
            <li>Vue Router for SPA navigation</li>
            <li>PWA manifest for installability</li>
            <li>All loaded via CDN (no npm)</li>
          </ul>
        </div>
      `
    };

    const Contact = {
      template: `
        <div class="page">
          <h1>Contact Page</h1>
          <p>You can reach us at:</p>
          <p><strong>Email:</strong> example@vue-pwa.com</p>
          <p><strong>Phone:</strong> (555) 123-4567</p>
        </div>
      `
    };

    const NotFound = {
      template: `
        <div class="page">
          <h1>404 - Page Not Found</h1>
          <p>Sorry, the page you're looking for doesn't exist.</p>
          <router-link to="/">Go back to home</router-link>
        </div>
      `
    };

    // Tabla de rutas. La ruta comodín en Vue Router 4 usa :pathMatch(.*)*
    // (en Vue Router 3 era '*').
    const routes = [
      { path: '/', component: Home },
      { path: '/about', component: About },
      { path: '/contact', component: Contact },
      { path: '/:pathMatch(.*)*', component: NotFound }
    ];

    // createRouter + createWebHashHistory: enrutador con rutas tras el #
    // (/#/about), para que funcione con archivos estáticos sin configurar servidor.
    const router = VueRouter.createRouter({
      history: VueRouter.createWebHashHistory(),
      routes
    });

    // createApp crea la aplicación Vue 3 (sustituye a `new Vue(...)` de Vue 2).
    const app = Vue.createApp({});

    // Instalamos el router como plugin y montamos la app en <div id="app">.
    app.use(router);
    app.mount('#app');
  </script>

  <script>
    // Registro del service worker: es lo que convierte la SPA en una PWA.
    // Comprobamos que el navegador lo soporte y registramos sw.js, que se
    // encargará de cachear los archivos para que la app funcione offline.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(registration => {
            console.log('Service Worker registrado con éxito:', registration.scope);
          })
          .catch(error => {
            console.log('Error al registrar el Service Worker:', error);
          });
      });
    }
  </script>
</body>
</html>
