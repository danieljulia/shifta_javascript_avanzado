<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vue SPA Example</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css">
<link rel="stylesheet" href="styles.css">

  
</head>
<body>
  <div id="app">

    <!-- router-link: componente de Vue Router que genera un enlace de navegación
         interna (sin recargar la página). "to" indica la ruta destino. -->
    <div class="nav">
      <router-link to="/">Home</router-link>
      <router-link to="/about">About</router-link>
      <router-link to="/contact">Contact</router-link>
    </div>

    <!-- router-view: "hueco" donde Vue Router pinta el componente de la ruta activa.
         En Vue Router 4, para animar el cambio de ruta se usa v-slot para obtener
         el componente actual y se envuelve en <transition> con <component :is>.
         (En Vue 2 se podía poner <transition> por fuera de <router-view>.) -->
    <router-view v-slot="{ Component }">
      <transition name="fade" mode="out-in">
        <component :is="Component" />
      </transition>
    </router-view>
  </div>

  <!-- Vue 3 y Vue Router 4 desde CDN (build "global": exponen Vue y VueRouter en window) -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="https://unpkg.com/vue-router@4/dist/vue-router.global.js"></script>

  <script>
    // Definimos los componentes de cada ruta (objetos con un template).
    const Home = {
      template: `
        <div class="page">
          <h1>Home Page</h1>
          <p>Welcome to our Vue SPA with PWA capabilities!</p>
          <p>This is a simple example of a Single Page Application built with Vue.js and Vue Router.</p>
          <p>You can add this to your home screen as a PWA!</p>
        </div>
      `
    };

    const About = {
      template: `
        <div class="page">
          <h1>About Page</h1>
          <p>This is a demonstration of:</p>
          <ul>
            <li>Vue.js for reactive UI</li>
            <li>Vue Router for SPA navigation</li>
            <li>PWA manifest for installability</li>
            <li>All loaded via CDN (no npm)</li>
          </ul>
        </div>
      `
    };

    const Contact = {
      template: `
        <div class="page">
          <h1>Contact Page</h1>
          <p>You can reach us at:</p>
          <p><strong>Email:</strong> example@vue-pwa.com</p>
          <p><strong>Phone:</strong> (555) 123-4567</p>
        </div>
      `
    };

    const NotFound = {
      template: `
        <div class="page">
          <h1>404 - Page Not Found</h1>
          <p>Sorry, the page you're looking for doesn't exist.</p>
          <router-link to="/">Go back to home</router-link>
        </div>
      `
    };

    // Tabla de rutas: cada entrada asocia una URL con un componente.
    // La ruta "comodín" en Vue Router 4 se escribe con el parámetro
    // :pathMatch(.*)* (en Vue Router 3 era simplemente '*').
    const routes = [
      { path: '/', component: Home },
      { path: '/about', component: About },
      { path: '/contact', component: Contact },
      { path: '/:pathMatch(.*)*', component: NotFound }
    ];

    // createRouter: crea el enrutador (en Vue Router 3 era `new VueRouter(...)`).
    // createWebHashHistory: las rutas van tras el # de la URL (/#/about),
    // así el ejemplo funciona sirviendo los archivos estáticos sin configurar
    // el servidor (equivalente al modo por defecto de Vue Router 3).
    const router = VueRouter.createRouter({
      history: VueRouter.createWebHashHistory(),
      routes
    });

    // createApp: crea la aplicación Vue (en Vue 2 era `new Vue({...})`).
    const app = Vue.createApp({});

    // app.use(router): instalamos el router como plugin de la aplicación,
    // lo que habilita <router-link>, <router-view> y this.$route / this.$router.
    app.use(router);

    // app.mount('#app'): monta la aplicación sobre el <div id="app"> del HTML.
    // En Vue 2 se hacía con `.$mount('#app')` encadenado a `new Vue(...)`.
    app.mount('#app');
  </script>
</body>
</html>
