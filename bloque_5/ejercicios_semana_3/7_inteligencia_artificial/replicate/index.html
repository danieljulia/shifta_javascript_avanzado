<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de imágenes con Replicate</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            max-width: 720px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        form {
            display: flex;
            gap: 0.5rem;
        }
        input {
            flex: 1;
            padding: 0.5rem;
            font-size: 1rem;
        }
        button {
            padding: 0.5rem 1rem;
            font-size: 1rem;
            cursor: pointer;
        }
        #status {
            margin-top: 1rem;
            color: #666;
        }
        #generatedImage {
            margin-top: 1rem;
            max-width: 100%;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <h1>Generador de imágenes</h1>
    <p>Modelo: <code>black-forest-labs/flux-schnell</code> (Replicate)</p>

    <form id="promptForm">
        <input
            id="promptInput"
            type="text"
            value='matcha cake spelling out the words "SHIFTA", tasty, food photography, dynamic shot'
            placeholder="Describe la imagen que quieres generar..."
            required
        >
        <button type="submit">Generar</button>
    </form>

    <p id="status"></p>
    <img id="generatedImage" alt="Imagen generada" style="display:none;">

    <script>
        const form = document.getElementById('promptForm');
        const status = document.getElementById('status');
        const img = document.getElementById('generatedImage');

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            const prompt = document.getElementById('promptInput').value;

            status.textContent = 'Generando imagen... (puede tardar unos segundos)';
            img.style.display = 'none';

            try {
                const response = await fetch('/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt })
                });
                const data = await response.json();

                if (!response.ok) throw new Error(data.error);

                img.src = data.imageUrl;
                img.style.display = 'block';
                status.textContent = '';
            } catch (error) {
                status.textContent = 'Error: ' + error.message;
            }
        });
    </script>
</body>
</html>
