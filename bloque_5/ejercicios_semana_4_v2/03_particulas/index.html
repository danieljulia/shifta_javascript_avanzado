<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>03 · Sistema de partículas</title>
<style>
  body { margin: 0; background: #141417; display: grid; place-items: center; min-height: 100vh; }
  canvas { border: 1px solid #33333b; background: #141417; cursor: crosshair; }
</style>
</head>
<body>
<canvas id="lienzo" width="800" height="600"></canvas>
<script>
/* ============================================================
   03 · SISTEMA DE PARTÍCULAS
   Nacen, se mueven con velocidad y aceleración, mueren.
   Haz clic (o arrastra) sobre el lienzo para lanzar un chorro.
   ============================================================ */

const canvas = document.getElementById("lienzo");
const ctx = canvas.getContext("2d");

class Particula {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    // velocidad inicial aleatoria en todas direcciones
    const ang = Math.random() * Math.PI * 2;
    const rapidez = 1 + Math.random() * 3;
    this.vx = Math.cos(ang) * rapidez;
    this.vy = Math.sin(ang) * rapidez;
    this.vida = 1;                 // 1 → 0; cuando llega a 0, muere
    this.decaimiento = 0.004 + Math.random() * 0.008;
    this.radio = 1 + Math.random() * 3;
    this.tono = Math.random();     // fase de color propia
  }
  paso() {
    // física básica: la aceleración (gravedad) modifica la velocidad,
    // y la velocidad modifica la posición
    this.vy += 0.03;                          // gravedad hacia abajo
    this.vx *= 0.99;                          // fricción
    this.vy *= 0.99;
    this.x += this.vx;
    this.y += this.vy;
    this.vida -= this.decaimiento;            // envejece

    // dibuja: cuanto menor la vida, más transparente
    const alfa = Math.max(this.vida, 0);
    ctx.fillStyle = `hsla(${20 + this.tono * 30}, 85%, ${55 + alfa * 25}%, ${alfa})`;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radio * alfa + 0.3, 0, Math.PI * 2);
    ctx.fill();
  }
  get muerta() { return this.vida <= 0; }
}

const particulas = [];

function estallar(x, y, cantidad = 24) {
  for (let i = 0; i < cantidad; i++) particulas.push(new Particula(x, y));
}

// estallido inicial de bienvenida
estallar(canvas.width / 2, canvas.height / 2, 80);

canvas.addEventListener("pointermove", (e) => {
  const r = canvas.getBoundingClientRect();
  estallar(e.clientX - r.left, e.clientY - r.top, 3);
});
canvas.addEventListener("pointerdown", (e) => {
  const r = canvas.getBoundingClientRect();
  estallar(e.clientX - r.left, e.clientY - r.top, 60);
});

function dibujar() {
  // fondo con alfa bajo → las estelas persisten y crean textura
  ctx.fillStyle = "rgba(20, 20, 23, 0.18)";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // recorremos de atrás hacia delante para poder borrar las muertas
  for (let i = particulas.length - 1; i >= 0; i--) {
    particulas[i].paso();
    if (particulas[i].muerta) particulas.splice(i, 1);  // entierro
  }

  requestAnimationFrame(dibujar);
}
requestAnimationFrame(dibujar);
</script>
</body>
</html>
